{% extends "base.html" %}
{% block content %}
<h1>Настройки</h1>
<form method="post" action="/admin/settings" class="form" enctype="multipart/form-data">
  <section class="card section">
    <h2>Основное</h2>
    <label>Контакт техподдержки (username, ссылка или ID)
      <input type="text" name="support_contact" value="{{ support_contact }}">
    </label>
  </section>

  <section class="card section">
    <h2>Кнопки главного меню</h2>
    <div class="grid2">
      <label>Кнопка «Товары»
        <input type="text" name="btn_catalog" value="{{ btn_catalog }}">
      </label>
      <label class="check">
        <input type="checkbox" name="proofs_enabled" {% if proofs_enabled == "1" %}checked{% endif %}>
        Показывать кнопку «Доказательства»
      </label>
      <label>Кнопка «Доказательства»
        <input type="text" name="btn_proofs" value="{{ btn_proofs }}">
      </label>
      <label>Кнопка «Техподдержка»
        <input type="text" name="btn_support" value="{{ btn_support }}">
      </label>
      <label>Кнопка «Админка»
        <input type="text" name="btn_admin" value="{{ btn_admin }}">
      </label>
    </div>
    <label>Текст раздела «Доказательства»
      <textarea name="proofs_text" rows="4">{{ proofs_text }}</textarea>
    </label>
  </section>

  <section class="card section">
    <h2>Вступление</h2>
    <label>Вступительный текст
      <textarea name="intro" rows="4">{{ intro }}</textarea>
    </label>
    <label>Медиа вступления (`file_id` или URL)
      <input type="text" name="intro_photo" value="{{ intro_photo }}">
    </label>
    <div class="grid2">
      <label>Тип медиа вступления
        <select name="intro_media_type">
          <option value="none" {% if intro_media_type == "none" %}selected{% endif %}>Без медиа</option>
          <option value="photo" {% if intro_media_type == "photo" %}selected{% endif %}>Фото</option>
          <option value="video" {% if intro_media_type == "video" %}selected{% endif %}>Видео</option>
          <option value="animation" {% if intro_media_type == "animation" %}selected{% endif %}>GIF/Анимация</option>
          <option value="document" {% if intro_media_type == "document" %}selected{% endif %}>Документ</option>
        </select>
      </label>
      <label>Загрузить медиа вступления
        <input type="file" name="intro_photo_upload" accept="image/*,video/*,.gif">
      </label>
    </div>
    <label class="check">
      <input type="checkbox" name="intro_no_media">
      Не показывать медиа во вступлении
    </label>
  </section>

  <section class="card section">
    <h2>Способы оплаты</h2>
    <div class="grid2">
      <label class="check">
        <input type="checkbox" name="crypto_enabled" {% if crypto_enabled == "1" %}checked{% endif %}>
        CryptoBot включен
      </label>
      <label class="check">
        <input type="checkbox" name="card_enabled" {% if card_enabled == "1" %}checked{% endif %}>
        Перевод/Карта включен
      </label>
      <label class="check">
        <input type="checkbox" name="ozon_enabled" {% if ozon_enabled == "1" %}checked{% endif %}>
        Озон Банк включен
      </label>
      <label class="check">
        <input type="checkbox" name="yandex_enabled" {% if yandex_enabled == "1" %}checked{% endif %}>
        Яндекс Банк включен
      </label>
      <label class="check">
        <input type="checkbox" name="yoomoney_enabled" {% if yoomoney_enabled == "1" %}checked{% endif %}>
        ЮMoney включен
      </label>
    </div>
    <div class="grid2">
      <label>Реквизиты: Перевод/Карта
        <textarea name="manual_instructions" rows="4">{{ manual_instructions }}</textarea>
      </label>
      <label>Реквизиты: Озон Банк
        <textarea name="ozon_instructions" rows="4">{{ ozon_instructions }}</textarea>
      </label>
      <label>Реквизиты: Яндекс Банк
        <textarea name="yandex_instructions" rows="4">{{ yandex_instructions }}</textarea>
      </label>
      <label>Реквизиты: ЮMoney
        <textarea name="yoomoney_instructions" rows="4">{{ yoomoney_instructions }}</textarea>
      </label>
    </div>
    <div class="grid2">
      <label>Кнопка оплаты Crypto
        <input type="text" name="btn_pay_crypto" value="{{ btn_pay_crypto }}">
      </label>
      <label>Кнопка «Перевод/Карта»
        <input type="text" name="btn_pay_card" value="{{ btn_pay_card }}">
      </label>
      <label>Кнопка «Озон Банк»
        <input type="text" name="btn_pay_ozon" value="{{ btn_pay_ozon }}">
      </label>
      <label>Кнопка «Яндекс Банк»
        <input type="text" name="btn_pay_yandex" value="{{ btn_pay_yandex }}">
      </label>
      <label>Кнопка «ЮMoney»
        <input type="text" name="btn_pay_yoomoney" value="{{ btn_pay_yoomoney }}">
      </label>
      <label>Кнопка «Я оплатил»
        <input type="text" name="btn_i_paid" value="{{ btn_i_paid }}">
      </label>
      <label>Кнопка «Назад»
        <input type="text" name="btn_back" value="{{ btn_back }}">
      </label>
      <label>Кнопка отмены заказа
        <input type="text" name="btn_cancel_order" value="{{ btn_cancel_order }}">
      </label>
      <label>Кнопка «Купить»
        <input type="text" name="btn_buy" value="{{ btn_buy }}">
      </label>
    </div>
  </section>

  <div class="actions sticky-actions">
    <button class="btn" type="submit">Сохранить настройки</button>
  </div>
</form>
{% endblock %}
