<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Bot Shop Admin" }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/admin">Bot Shop Admin</a>
      {% if is_auth %}
      <nav class="nav">
        <a href="/admin">Дашборд</a>
        <a href="/admin/products">Товары</a>
        <a href="/admin/settings">Настройки</a>
        <a href="/admin/orders">Заказы</a>
        <a href="/admin/broadcast">Рассылка</a>
      </nav>
      <form method="post" action="/admin/logout">
        <button class="btn ghost" type="submit">Выйти</button>
      </form>
      {% endif %}
    </div>
  </header>

  <main class="wrap">
    {% if flash %}
      <div class="flash {{ flash.level }}">{{ flash.text }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
